name: Build Chrome extension

on:
  push:
    branches:
      - jianheng71-bugfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Chrome extension
        run: npm run build

      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: CityU-Universal-Sinno-Chrome
          path: build/chrome-mv3-prod/
          if-no-files-found: error
          retention-days: 30
